name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `ignore: brands` : seul contrôle HACS neutralisé, et il l'est en
      # connaissance de cause.
      #
      # HACS attend des images de marque dans
      # custom_components/addon_mount_guard/brand/, ou une entrée dans le dépôt
      # home-assistant/brands. Il n'y en a ni l'une ni l'autre, par choix.
      #
      # La portée est purement cosmétique : ce contrôle conditionne l'entrée au
      # magasin HACS par défaut, pas l'installation depuis un dépôt
      # personnalisé. Sans images, l'intégration s'installe et fonctionne — sa
      # fiche n'a simplement pas de visuel. Le jour où les images arrivent,
      # retirer cette ligne est la première chose à faire : elle masquerait
      # alors un vrai défaut.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  # hassfest valide le manifeste pour de vrai. Attention au périmètre exact :
  # l'action passe --integration-path, donc specific_integrations est vrai, et
  # dependencies.py saute alors _validate_dependencies (existence) et
  # _validate_circular_dependencies (cycles). Ce qui tourne effectivement ici :
  # la règle « composant importé mais non déclaré », l'ordre des clés, le
  # vocabulaire d'integration_type et la présence de « version ». Ne pas
  # supprimer d'autre test en croyant hassfest le couvrir.
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements_test.txt
            custom_components/addon_mount_guard/manifest.json

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements_test.txt
          python scripts/manifest_requirements.py
          python -m pip install -r manifest-requirements.txt

      - name: Run tests
        run: pytest -q

      # Après les tests : un simple dépassement de ligne ne doit pas masquer
      # l'état réel du code et coûter un aller-retour.
      # « . » plutôt qu'une liste de chemins, qui laisserait passer un futur
      # fichier à la racine.
      - name: Lint
        run: ruff check . --output-format=github

  # Les tests tournent avec un Home Assistant simulé : ils ne peuvent pas dire
  # qu'un module importé existe réellement. Ce job le vérifie, avec le vrai
  # paquet installé — c'est le seul endroit qui verrait `get_supervisor_client`
  # disparaître du composant hassio, ou `aiohasupervisor` changer ses modèles.
  import-check:
    name: import-check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Épinglé au plancher déclaré dans hacs.json, et sur le Python que
          # cette version exige. À bouger avec le plancher, pas avant : sans ce
          # job, le plancher ne serait qu'un nombre dans hacs.json que rien
          # n'exécute.
          - name: plancher
            python-version: "3.13"
            homeassistant: homeassistant==2026.1.0
          # Volontairement non épinglé : ce job doit virer au rouge quand une
          # version amont casse l'intégration. C'est le signal recherché, y
          # compris sur l'exécution programmée quotidienne. 3.14 et non la
          # version du plancher : le HA le plus récent l'exige depuis 2026.3, et
          # sur 3.13 la résolution retomberait en silence sur une version plus
          # ancienne — le job cesserait de faire ce pour quoi il existe.
          - name: dernière
            python-version: "3.14"
            homeassistant: homeassistant
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Home Assistant
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.homeassistant }}"
          python scripts/manifest_requirements.py
          python -m pip install -r manifest-requirements.txt

      # `aiohasupervisor` n'est PAS une dépendance du paquet `homeassistant` :
      # c'est une dépendance du COMPOSANT hassio, que Home Assistant installe
      # au moment de le mettre en place. Elle figurait encore dans les
      # requires_dist du cœur en 2026.1.0 et en est sortie depuis — c'est
      # précisément ce qu'a révélé le premier passage de ce job.
      #
      # On la lit donc dans le manifeste du composant plutôt que de l'épingler
      # ici : c'est exactement ce que Home Assistant installerait, à la version
      # qu'il exige, et ça reste juste quand l'amont change de borne.
      - name: Install the hassio component requirements, as Home Assistant would
        run: |
          python - <<'PY' > hassio-requirements.txt
          import json
          import pathlib

          import homeassistant

          manifest = pathlib.Path(homeassistant.__file__).parent / "components/hassio/manifest.json"
          print("\n".join(json.loads(manifest.read_text("utf-8"))["requirements"]))
          PY
          cat hassio-requirements.txt
          python -m pip install -r hassio-requirements.txt

      - name: Import every module of the integration
        run: |
          python -c "
          import importlib
          for suffix in ('', '.const', '.models', '.mount_table', '.machine',
                         '.supervisor_api', '.reachability', '.fileops', '.repair',
                         '.coordinator', '.entities', '.websocket_api',
                         '.config_flow', '.sensor', '.binary_sensor', '.button'):
              name = 'custom_components.addon_mount_guard' + suffix
              importlib.import_module(name)
              print('ok', name)

          # Le point d'entrée du Superviseur. C'est une API interne : sa
          # disparition ne produirait aucune alerte ailleurs.
          from homeassistant.components.hassio import get_supervisor_client
          print('ok get_supervisor_client')

          # Les six opérations réellement employées, sur le client typé. Un
          # renommage amont casse l'intégration en silence : les tests passent
          # un double, et rien d'autre ne regarde la vraie bibliothèque.
          #
          # On interroge les classes de composant, pas __annotations__ du
          # client : mounts et addons y sont des @property, donc absentes
          # des annotations — une vérification écrite dessus passerait pour
          # stricte tout en ne regardant rien.
          from aiohasupervisor import SupervisorClient
          from aiohasupervisor.addons import AddonsClient
          from aiohasupervisor.mounts import MountsClient
          for name in ('mounts', 'addons'):
              assert isinstance(getattr(SupervisorClient, name, None), property), name
              print('ok SupervisorClient.' + name)
          for holder, methods in ((MountsClient, ('info', 'reload_mount')),
                                  (AddonsClient, ('list', 'addon_info',
                                                  'start_addon', 'stop_addon'))):
              for method in methods:
                  assert callable(getattr(holder, method, None)), method
                  print('ok', holder.__name__ + '.' + method)

          # Le flux d'options ne reçoit plus l'entrée : il la tient de la
          # propriété de sa classe de base. Rétablir l'argument produit un
          # TypeError à l'ouverture des options, que rien d'autre ne verrait —
          # importer le module ne construit pas le flux.
          from custom_components.addon_mount_guard.config_flow import MountGuardConfigFlow
          MountGuardConfigFlow.async_get_options_flow(None)
          print('ok flux d options construit sans argument')

          # Le job « dernière » retombe en silence sur un HA ancien si son
          # interpréteur est trop vieux : la version obtenue doit rester dans
          # l intervalle supporté.
          from homeassistant.const import __version__ as ha_version
          print('HA', ha_version)
          assert int(ha_version.split('.')[0]) >= 2026, f'HA {ha_version} sous le plancher'
          "

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests de rendu
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Vérifier que le bundle commité est à jour
        run: |
          if ! git diff --quiet custom_components/addon_mount_guard/www/mount-guard-card.js; then
            echo "::error::Le bundle commité diffère du build. Exécute 'cd frontend && npm run build' avant de pousser."
            git --no-pager diff --stat custom_components/addon_mount_guard/www/mount-guard-card.js
            exit 1
          fi
