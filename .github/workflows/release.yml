name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Ce workflow **ne pousse rien sur `main`**, et c'est une correction payée
# cher. Sa version précédente, reprise du dépôt d'origine, recalculait les
# numéros de version à partir du tag puis committait le résultat sur `main`.
# Le jour où un tag existant a été repoussé — réécriture d'historique — le
# workflow s'est rejoué et a **ramené `main` à la version du tag**, écrasant
# celle d'après.
#
# Le bump automatique n'a donc plus lieu d'être : les versions sont posées
# dans le commit AVANT de poser le tag, et ce workflow se contente de
# **vérifier** qu'elles correspondent. Une vérification qui échoue coûte un
# tag à refaire ; un bump automatique qui part de travers coûte une branche.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Le tag lui-même, pas `main` : c'est le code qu'on publie qu'on teste.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements_test.txt
            custom_components/addon_mount_guard/manifest.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Le manifeste seul suffit ici : `tests/test_manifest.py` croise ensuite
      # les cinq autres fichiers avec lui, donc une seule comparaison relie le
      # tag à l'ensemble.
      - name: Le manifeste doit déclarer la version du tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DECLARED=$(python -c "
          import json
          print(json.load(open('custom_components/addon_mount_guard/manifest.json'))['version'])
          ")
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::Le manifeste déclare ${DECLARED}, le tag dit ${VERSION}."
            echo "::error::Posez les versions dans un commit, puis taguez ce commit."
            exit 1
          fi
          echo "manifeste et tag d'accord sur ${VERSION}"

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements_test.txt
          python scripts/manifest_requirements.py
          python -m pip install -r manifest-requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        run: pytest -q

      - name: Rebuild the bundle and check it matches what is committed
        run: |
          (cd frontend && npm run typecheck && npm run build)
          if ! git diff --quiet custom_components/addon_mount_guard/www/mount-guard-card.js; then
            echo "::error::Le bundle commité diffère du build. Rien n'est publié."
            git --no-pager diff --stat custom_components/addon_mount_guard/www/mount-guard-card.js
            exit 1
          fi

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          {
            echo "## Changements"
            echo ""
            echo "$CHANGELOG"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          # Une version portant un suffixe (-alpha, -beta, -rc) est publiée en
          # pré-version. HACS ne les propose qu'aux utilisateurs qui ont coché
          # « afficher les versions bêta » : c'est ce qui permet de publier une
          # alpha sans la pousser à tout le monde.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
